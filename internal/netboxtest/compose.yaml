# A disposable NetBox for tests and for trying TrueUp by hand. See README.md.
#
# This file is the only definition of the stack. `make netbox-up` runs it with
# Docker Compose, and the netboxtest package reads it to start the same
# containers with testcontainers-go. netboxtest understands only the Compose
# keys used here and rejects any other, so the two can't drift apart.
#
# Every credential below is a dummy value for this stack alone. Never reuse
# them, and never publish this NetBox beyond 127.0.0.1.
#
# Two profiles choose which NetBox runs on the shared PostgreSQL and Valkey:
# "stock", netbox-docker's image as it is, and "branching", that image with
# netbox-branching added (branching/Dockerfile) and the background worker the
# plugin needs. Start exactly one: `make netbox-up NETBOX_PROFILE=branching`,
# or NETBOXTEST_PROFILE for the tests.
#
# Images are pinned by digest. Dependabot proposes updates (.github/dependabot.yml).
# The NetBox version is the project's target (docs/adr/0003): moving it also
# means moving branching/Dockerfile's base, netboxtest.Version and
# NETBOX_VERSION in the Makefile.

name: trueup-netbox

services:
  postgres:
    image: docker.io/library/postgres:18.6-alpine3.24@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: insecure-test-only
    # The data is thrown away, so durability isn't worth paying for.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    expose: ["5432"]
    # A health check gives up after start_period plus retries checks, each
    # interval plus timeout apart: 1m45s here. netboxtest waits as long.
    healthcheck:
      # Over TCP, which the entrypoint's temporary server during initdb doesn't listen on.
      test: ["CMD", "pg_isready", "--quiet", "--host=127.0.0.1", "--dbname=netbox", "--username=netbox"]
      start_period: 1m
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3

  valkey:
    image: docker.io/valkey/valkey:9.2.0-alpine3.24@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
    # No snapshots: the queue and cache are thrown away with the stack.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3

  netbox:
    profiles: ["stock"]
    image: docker.io/netboxcommunity/netbox:v4.7.2-5.1.1@sha256:3cf9d3bd77aa186233b84d0ea1cf1755581d5e5678fa7d86ec3be62f79d0c643
    user: "netbox:root"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: insecure-test-only
      # One Valkey serves both, with separate databases as NetBox requires.
      REDIS_HOST: valkey
      REDIS_DATABASE: "0"
      REDIS_CACHE_HOST: valkey
      REDIS_CACHE_DATABASE: "1"
      # Only these names, not netbox-docker's default "*": a web page that
      # rebinds its own name to 127.0.0.1 would otherwise reach this NetBox.
      ALLOWED_HOSTS: "localhost 127.0.0.1 [::1]"
      SECRET_KEY: insecure-test-only-secret-key-for-a-disposable-local-netbox
      # v2 API tokens need a pepper of at least 50 characters.
      API_TOKEN_PEPPER_1: insecure-test-only-token-pepper-for-a-disposable-local-netbox
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@example.com
      SUPERUSER_PASSWORD: insecure-test-only
      # Nothing leaves this machine: no census report, release check or Copilot.
      CENSUS_REPORTING_ENABLED: "false"
      ISOLATED_DEPLOYMENT: "true"
      COPILOT_ENABLED: "false"
    ports:
      # Loopback only. Tests ignore the host port and take a random one.
      - "127.0.0.1:${NETBOX_PORT:-8000}:8080"
    healthcheck:
      # netbox-docker's own check. It passes once migrations have run, the
      # superuser exists and the web server answers.
      test: ["CMD", "/opt/netbox/health.sh"]
      # A fresh database needs about 4 minutes of migrations, and more on a slow
      # machine. With PostgreSQL and Valkey, up to 15m45s in all.
      start_period: 12m
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 3

  # NetBox with netbox-branching: the same NetBox, configuration and data,
  # built from branching/ on this machine. TestComposeFile checks that its
  # environment, ports and health check are netbox's.
  netbox-branching:
    profiles: ["branching"]
    build:
      context: branching
    user: "netbox:root"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: insecure-test-only
      # One Valkey serves both, with separate databases as NetBox requires.
      REDIS_HOST: valkey
      REDIS_DATABASE: "0"
      REDIS_CACHE_HOST: valkey
      REDIS_CACHE_DATABASE: "1"
      # Only these names, not netbox-docker's default "*": a web page that
      # rebinds its own name to 127.0.0.1 would otherwise reach this NetBox.
      ALLOWED_HOSTS: "localhost 127.0.0.1 [::1]"
      SECRET_KEY: insecure-test-only-secret-key-for-a-disposable-local-netbox
      # v2 API tokens need a pepper of at least 50 characters.
      API_TOKEN_PEPPER_1: insecure-test-only-token-pepper-for-a-disposable-local-netbox
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@example.com
      SUPERUSER_PASSWORD: insecure-test-only
      # Nothing leaves this machine: no census report, release check or Copilot.
      CENSUS_REPORTING_ENABLED: "false"
      ISOLATED_DEPLOYMENT: "true"
      COPILOT_ENABLED: "false"
    ports:
      # Loopback only. Tests ignore the host port and take a random one.
      - "127.0.0.1:${NETBOX_PORT:-8000}:8080"
    healthcheck:
      # netbox-docker's own check. It passes once migrations have run, the
      # superuser exists and the web server answers.
      test: ["CMD", "/opt/netbox/health.sh"]
      # A fresh database needs about 4 minutes of migrations, and more on a slow
      # machine. With PostgreSQL and Valkey, up to 15m45s in all.
      start_period: 12m
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 3

  # netbox-branching provisions, syncs and merges branches in background jobs,
  # which this worker runs, as netbox-docker's own netbox-worker does. It starts
  # once NetBox has migrated the database, and has netbox-branching's environment.
  netbox-worker:
    profiles: ["branching"]
    build:
      context: branching
    user: "netbox:root"
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    depends_on:
      netbox-branching:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: insecure-test-only
      # One Valkey serves both, with separate databases as NetBox requires.
      REDIS_HOST: valkey
      REDIS_DATABASE: "0"
      REDIS_CACHE_HOST: valkey
      REDIS_CACHE_DATABASE: "1"
      # Only these names, not netbox-docker's default "*": a web page that
      # rebinds its own name to 127.0.0.1 would otherwise reach this NetBox.
      ALLOWED_HOSTS: "localhost 127.0.0.1 [::1]"
      SECRET_KEY: insecure-test-only-secret-key-for-a-disposable-local-netbox
      # v2 API tokens need a pepper of at least 50 characters.
      API_TOKEN_PEPPER_1: insecure-test-only-token-pepper-for-a-disposable-local-netbox
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@example.com
      SUPERUSER_PASSWORD: insecure-test-only
      # Nothing leaves this machine: no census report, release check or Copilot.
      CENSUS_REPORTING_ENABLED: "false"
      ISOLATED_DEPLOYMENT: "true"
      COPILOT_ENABLED: "false"
    # It listens on no port, but netboxtest needs one listed: given none,
    # testcontainers-go would publish whatever ports the image declares, on
    # every interface. 8080 is NetBox's web port, which nothing here serves,
    # and netboxtest publishes it on 127.0.0.1 only.
    expose: ["8080"]
    healthcheck:
      # netbox-docker's own check: the worker's process is running. netboxtest
      # also waits until NetBox reports it among its running workers.
      test: ["CMD-SHELL", "ps -eo args | grep -v grep | grep -q rqworker"]
      start_period: 1m
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3
