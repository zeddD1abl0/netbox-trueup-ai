name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.11

      - name: Lint Go
        run: make lint

      # sqlc's output is committed; it must match the SQL it comes from.
      - name: Check generated code
        run: make generate-check

      - name: Lint workflows and Markdown, scan for secrets
        run: make lint-repo
        env:
          GH_TOKEN: ${{ github.token }} # enables zizmor's online audits

      - name: Check for known vulnerabilities
        run: make vuln

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The two Go releases with security support. go.mod declares the older one.
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Test
        run: make test

      - name: Build
        run: make build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Each package with integration tests starts a fresh NetBox, which spends
    # about 4 minutes on migrations, and packages run one at a time. Two
    # packages have them, and `go test -timeout 30m` gives up on either with a
    # stack dump before this does.
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # Starts a disposable NetBox from internal/netboxtest/compose.yaml with
      # testcontainers-go, on the runner's own Docker.
      - name: Integration tests
        run: make test-integration
