name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.11

      - name: Lint Go
        run: make lint

      # sqlc's output is committed; it must match the SQL it comes from.
      - name: Check generated code
        run: make generate-check

      - name: Lint workflows and Markdown, scan for secrets
        run: make lint-repo
        env:
          GH_TOKEN: ${{ github.token }} # enables zizmor's online audits

      - name: Check for known vulnerabilities
        run: make vuln

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The two Go releases with security support. go.mod declares the older one.
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Test
        run: make test

      - name: Build
        run: make build

  integration:
    name: Integration tests (${{ matrix.profile }})
    runs-on: ubuntu-latest
    # Four packages with integration tests each start a fresh NetBox, which
    # spends about 4 minutes on migrations, and packages run one at a time.
    # Three more start PostgreSQL, in seconds. `go test -timeout 30m` gives up
    # on any one with a stack dump before this does.
    timeout-minutes: 65
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The whole suite against each NetBox: as netbox-docker ships it, and
        # with netbox-branching (internal/netboxtest/README.md).
        profile: [stock, branching]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # Starts a disposable NetBox from internal/netboxtest/compose.yaml, of
      # the profile NETBOX_PROFILE names, building the branching profile's
      # image, and PostgreSQL from internal/store/postgres/pgtest/compose.yaml,
      # with testcontainers-go, on the runner's own Docker.
      - name: Integration tests
        run: make test-integration
        env:
          NETBOX_PROFILE: ${{ matrix.profile }}

  # The required check for both profiles, so that the main ruleset names one
  # check whatever the matrix holds. It passes only if every profile passed.
  integration-result:
    name: Integration tests
    if: always()
    needs: integration
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check every profile passed
        env:
          RESULT: ${{ needs.integration.result }}
        run: |
          echo "The integration tests' result: $RESULT"
          test "$RESULT" = success
