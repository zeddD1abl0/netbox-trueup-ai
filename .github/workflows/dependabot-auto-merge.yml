# Turns on auto-merge for Dependabot's patch and minor updates of Go modules
# and the test databases' images, so GitHub squash-merges them once the
# ruleset's required checks pass, and turns it off when a pull request no
# longer qualifies. Everything else waits for a maintainer, as other pull
# requests do. See docs/adr/0031-merge-routine-dependabot-updates-automatically.md.
name: Dependabot auto-merge

on:
  pull_request:
    # edited covers a change of base branch.
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge
    # Pull requests Dependabot opened, which later pushes don't change. Its
    # GitHub Actions updates never qualify, and are left out altogether, so a
    # new release of fetch-metadata never runs with this job's token before
    # a maintainer has reviewed it.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && !startsWith(github.head_ref, 'dependabot/github_actions/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # merge the pull request
      pull-requests: write # turn its auto-merge on and off
    steps:
      # Reads the update from Dependabot's commit message. It fails unless the
      # first commit is Dependabot's and GitHub verified its signature, which
      # is how a pull request someone else has pushed to is handed over, so its
      # failure only means the pull request doesn't qualify.
      - name: Read the update
        id: metadata
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # A pull request qualifies only when:
      # - Dependabot caused this event, by opening, pushing to or editing it,
      #   and started this run, which a re-run by anyone else doesn't;
      # - it is for the default branch, which the ruleset's checks guard;
      # - every commit in it is authored by dependabot[bot], and committed and
      #   signed by GitHub (web-flow), which a local rebase or amend by anyone
      #   else changes (GitHub's own rebase keeps them, but then the event's
      #   sender isn't Dependabot), and the last is this event's head;
      # - every dependency it updates is a Go module or an image in the tests'
      #   compose files (from the branch name), with a patch or minor update
      #   (fetch-metadata works an image's out from its tags, and gives ""
      #   when it can't), to a release, not a prerelease or a pseudo-version;
      #   and it is neither go-git nor go-billy, betas taken through reviewed
      #   updates (ADR 0020), nor the NetBox image, whose version is the
      #   target (ADR 0003);
      # - and go.mod's change, which can go beyond the modules Dependabot
      #   names, moves neither go-git nor go-billy, nor the go or toolchain
      #   line, which set the Go release TrueUp needs.
      # Auto-merge is then turned on if the head is still the one checked.
      # Otherwise the last step turns it off.
      - name: Turn auto-merge on if the pull request qualifies
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SENDER: ${{ github.event.sender.login }}
          ACTOR: ${{ github.triggering_actor }}
          READ: ${{ steps.metadata.outcome }}
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail

          qualifies=false
          if [ "$SENDER" != "dependabot[bot]" ]; then
            echo "$SENDER, not Dependabot, caused this event."
          elif [ "$ACTOR" != "dependabot[bot]" ]; then
            echo "$ACTOR, not Dependabot, started this run."
          elif [ "$BASE" != "$DEFAULT_BRANCH" ]; then
            echo "The pull request is for $BASE, not $DEFAULT_BRANCH."
          elif [ "$READ" != success ]; then
            echo "fetch-metadata couldn't read the update."
          elif ! jq -e 'type == "array" and length > 0' <<<"$DEPENDENCIES" >/dev/null 2>&1; then
            echo "fetch-metadata found no dependencies."
          else
            commits=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
              --jq '.[] | {sha, author: .author.login, committer: .committer.login, verified: .commit.verification.verified}' | jq -s .)
            others=$(jq -r '.[] | select(.author != "dependabot[bot]" or .committer != "web-flow" or (.verified | not)) | .sha[0:12]' <<<"$commits")
            last=$(jq -r 'last.sha // ""' <<<"$commits")
            if [ "$last" != "$HEAD_SHA" ]; then
              echo "The pull request has moved on from ${HEAD_SHA:0:12}."
            elif [ -n "$others" ]; then
              echo "Commits that aren't Dependabot's own: ${others//$'\n'/ }"
            else
              jq -r '.[] | "\(.packageEcosystem) \(.dependencyName) \(.prevVersion) -> \(.newVersion): \(.updateType)"' <<<"$DEPENDENCIES"
              reasons=$(jq -r '.[] | (
                  if .packageEcosystem != "go_modules" and .packageEcosystem != "docker_compose" then "not a Go module or a test image"
                  elif .updateType != "version-update:semver-patch" and .updateType != "version-update:semver-minor" then "not a patch or minor update (\"\(.updateType)\")"
                  elif (.newVersion // "") as $v | $v == ""
                    or (.packageEcosystem == "go_modules" and ($v | test("-")))
                    or ($v | test("alpha|beta|rc"; "i")) then "not a release (\"\(.newVersion)\")"
                  elif .dependencyName | test("^github\\.com/go-git/go-(git|billy)/") then "go-git, reviewed by hand"
                  elif .packageEcosystem == "docker_compose" and (.dependencyName | ascii_downcase | test("(^|/)netbox$")) then "NetBox, reviewed by hand"
                  else empty end) as $why | "  \(.dependencyName): \($why)"' <<<"$DEPENDENCIES")
              if [ -n "$reasons" ]; then
                printf 'Dependencies that don'"'"'t qualify:\n%s\n' "$reasons"
              else
                gomod=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
                  --jq '.[] | select(.filename == "go.mod") | if .patch then .patch else "+(patch not shown)" end')
                if grep -q -E -e '^\+.*github\.com/go-git/go-(git|billy)/' -e '^\+(go|toolchain) ' -e '^\+\(patch not shown\)$' <<<"$gomod"; then
                  echo "go.mod's change moves go-git, go-billy or the Go release, or GitHub doesn't show it."
                else
                  qualifies=true
                fi
              fi
            fi
          fi

          if [ "$qualifies" = true ]; then
            echo "Turning auto-merge on for ${HEAD_SHA:0:12}."
            gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          fi

      # Turns off an auto-merge an earlier run turned on, whenever this run
      # didn't turn it on: the pull request doesn't qualify, or deciding failed
      # part-way, for example on an API error. If even the state can't be read,
      # it tries anyway. A run cancelled for a newer one leaves it to that run.
      - name: Turn auto-merge off otherwise
        if: ${{ !cancelled() && steps.decide.outputs.enabled != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" != false ]; then
            echo "Turning auto-merge off; a maintainer merges this one."
            gh pr merge --disable-auto "$PR_URL"
          else
            echo "Auto-merge is off; a maintainer merges this one."
          fi
