# Turns on auto-merge for Dependabot's patch and minor updates of Go modules
# and the test databases' images, so GitHub squash-merges them once the
# ruleset's required checks pass, and turns it off when a pull request no
# longer qualifies. Everything else waits for a maintainer, as other pull
# requests do. See docs/adr/0031-merge-routine-dependabot-updates-automatically.md.
name: Dependabot auto-merge

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge
    # The pull request's author, which later pushes don't change.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # merge the pull request
      pull-requests: write # turn its auto-merge on and off
    steps:
      # Reads the update from Dependabot's commit message. It fails unless the
      # first commit is Dependabot's and GitHub verified its signature.
      - name: Read the update
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # A pull request qualifies when every commit in it is Dependabot's, with
      # a signature GitHub verified, so nothing anyone else pushes merges
      # without review, and when every dependency it updates qualifies:
      # - a Go module or an image in the tests' compose files (ecosystems come
      #   from the branch name);
      # - a patch or minor update; fetch-metadata works an image's out from
      #   its tags, and gives "" when it can't, which doesn't qualify;
      # - not go-git or go-billy, betas taken through reviewed updates
      #   (ADR 0020), and not NetBox, whose version is the target (ADR 0003).
      # It runs even when fetch-metadata fails, to turn auto-merge off.
      - name: Turn auto-merge on or off
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          READ: ${{ steps.metadata.outcome }}
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail

          others=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | select(.author.login != "dependabot[bot]" or (.commit.verification.verified | not)) | .sha[0:12]')

          qualifies=false
          if [ "$READ" != success ]; then
            echo "fetch-metadata couldn't read the update."
          elif [ -n "$others" ]; then
            echo "Commits that aren't Dependabot's, or aren't verified: ${others//$'\n'/ }"
          else
            jq -r '.[] | "\(.packageEcosystem) \(.dependencyName) \(.prevVersion) -> \(.newVersion): \(.updateType)"' <<<"$DEPENDENCIES"
            if jq -e 'length > 0 and all(.[];
                (.packageEcosystem == "go_modules" or .packageEcosystem == "docker_compose")
                and (.updateType == "version-update:semver-patch" or .updateType == "version-update:semver-minor")
                and (.dependencyName | startswith("github.com/go-git/") | not)
                and (.dependencyName | ascii_downcase | contains("netbox") | not))' <<<"$DEPENDENCIES" >/dev/null; then
              qualifies=true
            else
              echo "Not every dependency qualifies."
            fi
          fi

          if [ "$qualifies" = true ]; then
            echo "Turning auto-merge on."
            gh pr merge --auto --squash "$PR_URL"
          elif [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            echo "Turning auto-merge off; a maintainer merges this one."
            gh pr merge --disable-auto "$PR_URL"
          else
            echo "Leaving auto-merge off; a maintainer merges this one."
          fi
