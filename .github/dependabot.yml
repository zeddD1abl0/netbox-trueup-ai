# Weekly update PRs. The cooldown waits 7 days after a release before
# proposing it, so a compromised release is more likely to be caught first.
# Security updates are not delayed.
#
# Patch and minor updates of gomod and docker-compose entries merge
# themselves once the required checks pass, apart from those the workflow
# dependabot-auto-merge.yml holds back (ADR 0031). A new entry for either
# ecosystem comes under that rule too. Updates of every other ecosystem, pip
# included, wait for a maintainer.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      go-modules:
        patterns: ["*"]
        exclude-patterns: ["github.com/go-git/go-git/*", "github.com/go-git/go-billy/*"]
      # go-git and go-billy are betas, which a maintainer reviews (ADR 0020).
      # Grouped apart, they don't hold back the other modules' updates, which
      # merge themselves (ADR 0031).
      go-git:
        patterns: ["github.com/go-git/go-git/*", "github.com/go-git/go-billy/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  # Images of the disposable NetBox for tests (internal/netboxtest/compose.yaml).
  - package-ecosystem: docker-compose
    directory: /internal/netboxtest
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: test
      include: scope
    groups:
      # NetBox stays out of the group: its update fails TestComposeFile until
      # branching/Dockerfile's base moves with it, and netboxtest.Version too
      # for a new NetBox release, and shouldn't hold these back.
      test-databases:
        patterns: ["*postgres", "*valkey"]
    ignore:
      # NetBox 4.7 is the target (docs/adr/0003); a new minor release is a
      # decision, not an update. Patch releases are still proposed.
      - dependency-name: "*netbox"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # New major releases of PostgreSQL and Valkey wait until netbox-docker
      # moves to them.
      - dependency-name: "*postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*valkey"
        update-types: ["version-update:semver-major"]

  # netbox-branching, which the test NetBox's branching profile installs
  # (internal/netboxtest/branching/requirements.txt, pinned by hash). It pairs
  # with the NetBox release, so a maintainer reviews it, as the NetBox image;
  # the workflow never merges pip updates by itself.
  - package-ecosystem: pip
    directory: /internal/netboxtest/branching
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: test
      include: scope
    ignore:
      # 1.2.x is netbox-branching's line for NetBox 4.7, the target
      # (docs/adr/0003). A new minor release is for another NetBox release, and
      # moves with the target. Patch releases are still proposed.
      - dependency-name: "netboxlabs-netbox-branching"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The PostgreSQL of the storage tests (internal/store/postgres/pgtest/compose.yaml).
  - package-ecosystem: docker-compose
    directory: /internal/store/postgres/pgtest
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: test
      include: scope
    ignore:
      # 16 is the release tested for now; testing another is a decision.
      - dependency-name: "*postgres"
        update-types: ["version-update:semver-major"]
